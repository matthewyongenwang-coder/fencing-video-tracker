<!doctype html>
<html><head><meta charset="utf-8"><title>Riposte eval</title>
<style>body{font:13px ui-monospace,Menlo,monospace;background:#111;color:#ddd;padding:18px}
#log{white-space:pre-wrap;line-height:1.6}.ok{color:#5ec87a}.bad{color:#ff6b6b}.dim{color:#888}</style>
</head><body><div id="log">running…</div>
<video id="vid" src="testclip.mp4" muted playsinline></video>
<canvas id="work"></canvas>
<style>video,canvas{display:none}</style>
<script type="module">
import { DetectionGate, OverlapWatch, PisteAxis, MovementLabeler,
         CameraShift, StableFrame } from './riposte.js';
const log=document.getElementById('log'), say=(s,c='')=>log.innerHTML+=`\n${c?`<span class=${c}>`:''}${s}${c?'</span>':''}`;
const vid=document.getElementById('vid'), work=document.getElementById('work');
const wctx=work.getContext('2d',{willReadFrequently:true});
window.EVAL={};

await new Promise(r=>vid.readyState>=2?r():vid.addEventListener('loadeddata',r,{once:true}));
work.width=vid.videoWidth; work.height=vid.videoHeight;

function nextFrame(t){
  return new Promise(res=>{
    let done=false;
    const fin=(x)=>{if(!done){done=true;vid.removeEventListener('seeked',s);res(x);}};
    const s=()=>fin(vid.currentTime);
    vid.addEventListener('seeked',s);
    if(vid.requestVideoFrameCallback) vid.requestVideoFrameCallback((n,m)=>fin(m.mediaTime));
    if(Math.abs(vid.currentTime-t)<1e-4){fin(vid.currentTime);return;}
    vid.currentTime=t; setTimeout(()=>fin(vid.currentTime),2000);
  });
}

// ---------------- detectors ----------------
const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs');
const fileset=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm');

async function makeMediaPipe(score, maxResults){
  const opts={ baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite',delegate:'GPU'},
    scoreThreshold:score, categoryAllowlist:['person'], runningMode:'VIDEO'};
  if(maxResults) opts.maxResults=maxResults;
  const d=await vision.ObjectDetector.createFromOptions(fileset,opts);
  let ts=0;
  return { name:`mediapipe s=${score}${maxResults?` max=${maxResults}`:''}`,
    run(){ const r=d.detectForVideo(work, ts++);
      return r.detections.map(x=>({box:{x:x.boundingBox.originX,y:x.boundingBox.originY,
        w:x.boundingBox.width,h:x.boundingBox.height}, score:x.categories[0].score})); } };
}

const ort=await import('https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.webgpu.min.mjs');
ort.env.wasm.wasmPaths='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';
async function makeYolox(score){
  const sess=await ort.InferenceSession.create('yolox_person.onnx',{executionProviders:['webgpu']});
  const SZ=640, grids=[], strides=[];
  for(const s of [8,16,32]){const g=SZ/s;for(let y=0;y<g;y++)for(let x=0;x<g;x++){grids.push(x,y);strides.push(s);}}
  const off=new OffscreenCanvas(SZ,SZ), o=off.getContext('2d',{willReadFrequently:true});
  const plane=SZ*SZ, chw=new Float32Array(3*plane);
  return { name:`yolox s=${score}`, async run(){
    const scale=Math.min(SZ/work.width,SZ/work.height);
    o.fillStyle='rgb(114,114,114)'; o.fillRect(0,0,SZ,SZ);
    o.drawImage(work,0,0,Math.round(work.width*scale),Math.round(work.height*scale));
    const d=o.getImageData(0,0,SZ,SZ).data;
    for(let i=0;i<plane;i++){chw[i]=d[i*4+2];chw[plane+i]=d[i*4+1];chw[2*plane+i]=d[i*4];}
    const feeds={}; feeds[sess.inputNames[0]]=new ort.Tensor('float32',chw,[1,3,SZ,SZ]);
    const raw=(await sess.run(feeds))[sess.outputNames[0]].data;
    const A=grids.length/2, boxes=[];
    for(let i=0;i<A;i++){ const b=i*85, sc=raw[b+4]*raw[b+5];
      if(sc<score) continue;
      const st=strides[i], cx=(raw[b]+grids[i*2])*st, cy=(raw[b+1]+grids[i*2+1])*st;
      const w=Math.exp(raw[b+2])*st, h=Math.exp(raw[b+3])*st;
      boxes.push({box:{x:(cx-w/2)/scale,y:(cy-h/2)/scale,w:w/scale,h:h/scale},score:sc}); }
    boxes.sort((a,b)=>b.score-a.score);
    const keep=[], iou=(a,b)=>{const x1=Math.max(a.x,b.x),y1=Math.max(a.y,b.y),
      x2=Math.min(a.x+a.w,b.x+b.w),y2=Math.min(a.y+a.h,b.y+b.h);
      if(x2<=x1||y2<=y1)return 0;const ov=(x2-x1)*(y2-y1);return ov/(a.w*a.h+b.w*b.h-ov);};
    for(const b of boxes){ if(!keep.some(k=>iou(k.box,b.box)>0.5)) keep.push(b); }
    return keep; } };
}

// ---------------- the run ----------------
const BOX_A={x:255,y:425,w:205,h:240}, BOX_B={x:1490,y:400,w:200,h:210};
const FRAMES=221, FPS=30;

async function evaluate(detector, useCamera){
  // Rewind properly between configs. Without this the second run starts
  // at the end of the clip and every config reports the same thing,
  // which is exactly the trap this harness fell into first time.
  await new Promise(r=>{ if(Math.abs(vid.currentTime)<1e-4) return r();
    vid.addEventListener('seeked',r,{once:true}); vid.currentTime=0; });
  const fencers=[{label:'A',box:{...BOX_A},tracked:true},{label:'B',box:{...BOX_B},tracked:true}];
  const centre=f=>({x:f.box.x+f.box.w/2,y:f.box.y+f.box.h/2});
  const axis=new PisteAxis(centre(fencers[0]),centre(fencers[1]));
  const labelers=[new MovementLabeler(axis,+1),new MovementLabeler(axis,-1)];
  const gate=new DetectionGate(); const overlap=new OverlapWatch();
  const camera=new CameraShift(); const stable=new StableFrame();
  const lost=[0,0]; let prev=null, detTotal=0, firstLost=[null,null];
  let target=0;
  for(let i=0;i<FRAMES;i++){
    const t=await nextFrame(target); target+=1/FPS;
    if(target>vid.duration) break;
    wctx.drawImage(vid,0,0);
    const dets=await detector.run();
    detTotal+=dets.length;
    const dt=prev===null?1/FPS:Math.max(t-prev,1e-3); prev=t;
    if(useCamera) stable.accumulate(camera.update(work,fencers.map(f=>f.box)));
    const rep=gate.step(fencers,dets,dt,useCamera?stable:null);
    fencers.forEach((f,j)=>{ labelers[j].update(t,stable.stabilise(centre(f)),f.tracked);
      if(!f.tracked){ lost[j]++; if(firstLost[j]===null) firstLost[j]=i; } });
    overlap.update(fencers[0].box,fencers[1].box,fencers[0].tracked&&fencers[1].tracked);
  }
  return { lost, firstLost, avgDet:(detTotal/FRAMES).toFixed(1),
           finalX:fencers.map(f=>Math.round(f.box.x+f.box.w/2)) };
}

say('Python reference (no CSRT): A 0 lost, B 0 lost, final x about 274 and 182\n', 'dim');
say(`${'config'.padEnd(26)} ${'lost A/B'.padEnd(12)} ${'first lost'.padEnd(13)} ${'avg det'.padEnd(8)} final x A/B`);
say('-'.repeat(76));

const mp = await makeMediaPipe(0.30, 20);
const yx = await makeYolox(0.30);
const configs = [
  [mp, false, 'mediapipe, no camera'],
  [mp, true,  'mediapipe + camera'],
  [yx, false, 'yolox, no camera'],
  [yx, true,  'yolox + camera'],
];
for(const [det, useCam, label] of configs){
  const r=await evaluate(det, useCam);
  const good = r.lost[0]+r.lost[1] < 20;
  say(`${label.padEnd(26)} ${`${r.lost[0]}/${r.lost[1]}`.padEnd(12)} ` +
      `${`${r.firstLost[0]??'-'}/${r.firstLost[1]??'-'}`.padEnd(13)} ${String(r.avgDet).padEnd(8)} ` +
      `${r.finalX[0]}/${r.finalX[1]}`, good?'ok':'');
  window.EVAL[label]=r;
}
say('\nDONE'); window.EVAL_DONE=true;
</script></body></html>
